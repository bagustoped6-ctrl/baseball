<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A12">
<title>SiteName</title>
<meta name="description" content="Watch featured videos and live streams in one place.">

<script>
/* ==========================================================================
   PENGATURAN — semua yang perlu kamu ganti ada di blok ini
   (kode iklan ditempel di bagian <template> tepat di bawah blok ini).
   Mode bantuan: tambahkan di ujung link  ?sizes=1 (panduan ukuran gambar),
   ?adpreview=1 (lihat posisi slot iklan), ?ads=banner,native (pilih tipe iklan).
   Ubah teks di dalam tanda kutip "...". Jangan hapus koma (,) di akhir baris.
   ========================================================================== */
const SITE = {

  /* ---------- 1. IDENTITAS ---------- */
  name:    "LIVE SPORT NOW",
  tagline: "Watch featured videos and live streams in one place.",
  year:    2026,

  /* ---------- 2. TAMPILAN (warna & background) ----------
     Tiap area boleh diisi warna saja, gambar saja, atau dua-duanya
     (gambar tampil di atas warna).
       image: ""                      → warna saja
       image: "ChatGPT Image Sep 21, 2026, 02_51_53 AM.webp"                → file di folder yang sama dengan index.html
       image: "https://situs.com/a.jpg" → link gambar dari luar

     UKURAN GAMBAR YANG PAS
     (buka situskamu.com/?sizes=1 untuk melihat ukuran persis di HP-mu)
       • Background halaman — aman untuk HP & desktop : 1920 × 1280 px
           khusus HP (tegak) ............................ 1080 × 1920 px
           khusus desktop ............................... 1920 × 1080 px
       • Background area streaming (16:9) ............... 1280 × 720 px
           versi tajam .................................. 1920 × 1080 px
       • Motif kecil yang diulang (repeat) .............. 200 × 200 px
       • Sampul video / thumb (16:9) .................... 1280 × 720 px
     Pakai JPG untuk foto (usahakan di bawah 300 KB supaya cepat dibuka di HP),
     PNG untuk gambar dengan warna rata atau transparan.                        */
  theme: {

    colors: {
      primary:   "#00D4FF",    // warna utama: tombol, garis, glow
      secondary: "#0099FF"     // warna kedua: ujung gradasi tombol
    },

    /* Background halaman — area gelap di seluruh halaman */
    page: {
      color:    "#070A12",
      image:    "ChatGPT Image Sep 21, 2026, 02_51_53 AM.webp",
      size:     "cover",       // "cover" penuh layar | "contain" muat semua | "auto" ukuran asli
      position: "center",      // "center" | "top" | "bottom" | "50% 20%"
      repeat:   "no-repeat",   // "repeat" untuk motif kecil yang diulang
      fixed:    true,          // true = gambar diam saat halaman digeser
      dim:      0,             // 0–1, menggelapkan gambar biar tulisan tetap terbaca (coba 0.45)
      glow:     true           // cahaya biru lembut di belakang header
    },

    /* Background area streaming — di belakang & sekeliling kotak video */
    stage: {
      color:    "#000000",
      image:    "ChatGPT Image Sep 21, 2026, 02_51_53 AM.webp",
      size:     "cover",
      position: "center",
      repeat:   "no-repeat",
      dim:      0,             // 0–1, menggelapkan gambar area ini
      pad:      0,             // jarak (px) sekeliling kotak video.
                               // 0 = background tidak terlihat (kotak video menutupinya)
                               // 16–40 = background tampil sebagai bingkai di sekeliling video
      full:     false,         // true = background melebar sampai tepi kiri-kanan layar
      videoBg:  "#000000"      // warna DI DALAM kotak video (terlihat sebelum video diputar)
    }
  },

  /* ---------- 3. MENU DI HEADER ----------
     label   = tulisan di menu
     href    = tujuan link  (contoh: "https://situskamu.com/promo")
               "#tonton" / "#video-lain" = geser ke bagian halaman ini
     article = (ganti href) buka artikel popup, isi dengan kunci dari bagian ARTIKEL di bawah
     newTab  = true → buka di tab baru                                          */
  nav: [
    { label: "Watch",       href: "#tonton" },
    { label: "More videos", href: "#video-lain" },
    { label: "About",       article: "tentang" }
  ],

  /* ---------- 4. TOMBOL DI KANAN ATAS ----------
     style = "outline" (garis) atau "solid" (berwarna)                          */
  buttons: [
    { label: "Log in",  href: "#", style: "outline", newTab: false },
    { label: "Sign up", href: "#", style: "solid",   newTab: false }
  ],

  /* ---------- 5. ANIMASI LOADING & POPUP "WATCH" ---------- */
  loadingSeconds: 4,          // lama lingkaran loading sampai 100% (detik)
  autoStartLoading: false,    // true = loading langsung jalan saat halaman dibuka
                              // false = jalan setelah tombol play ditekan
  afterLoading: "popup",      // "popup" = tampil popup "Watch"
                              // "embed" = video YouTube langsung diputar di halaman
  watch: {
    title:  "Watch your video",   // tulisan di popup
    button: "Watch Now",          // tulisan di tombol popup
    newTab: true                  // true = link terbuka di tab baru
    // Tujuan tombol diatur per video lewat "link" di daftar VIDEO di bawah.
  },

  /* ---------- 6. IKLAN ----------
     Tipe yang aktif sekarang: BANNER, NATIVE, SOCIAL BAR.
     (Pop Under sudah kusiapkan juga, tinggal set enabled: true kalau suatu saat mau dipakai.)
     Kodenya ditempel di <template> di bawah blok ini (bukan di sini).

     banner   : di bawah header. Ada 6 pilihan UKURAN (lihat SITE.ads.banner.sizes
                di bawah) — kamu boleh isi kode di sebagian atau semuanya, lalu
                dirotasi sendiri (lihat penjelasan rotate di situ).
     native   : di bawah kotak deskripsi video.
     social   : Social Bar — hanya kode script, tampil mengambang (diatur jaringan iklan).
     popunder : Pop Under — hanya kode script, aktif saat pengunjung klik. (nonaktif)

     TES CEPAT tanpa edit file — tambahkan ?ads=... di link:
        situskamu.com/?ads=banner            → hanya banner
        situskamu.com/?ads=native,social     → native + social bar
        situskamu.com/?ads=none              → semua iklan mati
     (?ads=... juga berguna untuk mengetes: rotator dimatikan sementara.)
     Dengan begini kamu bisa arahkan trafik berbeda ke link berbeda lalu
     bandingkan hasil tiap tipe di dashboard jaringan iklanmu.               */
  ads: {
    showPlaceholder: false,   // false = slot kosong DISEMBUNYIKAN total (tidak ada kotak/tulisan)
                              // true  = tampilkan kotak putus-putus "Ad space" selama kode belum diisi
                              // Tips: tambahkan ?adpreview=1 di link untuk mengintip posisi slot tanpa ubah file
    mobileBreakpoint: 767,    // lebar layar (px) ke bawah = dianggap HP untuk memilih ukuran banner

    /* ---- BANNER — 6 pilihan ukuran standar ----
       Isi kode di <template> yang ID-nya cocok (lihat KODE IKLAN di bawah blok
       ini, misalnya <template id="ad-banner-728x90">). Boleh isi satu ukuran
       saja, boleh isi semuanya sekaligus — yang kosong otomatis dilewati.

       device : ukuran ini boleh tampil di perangkat apa.
                "desktop" | "mobile" | "both"
       rotate : true  = kalau lebih dari satu ukuran terisi untuk perangkat
                        yang sama, pilih SATU secara acak per pengunjung
                false = selalu pakai ukuran pertama yang terisi
       sticky : true = pengunjung yang sama tetap dapat ukuran yang sama
                selama tab belum ditutup (tidak berganti tiap refresh)
       weights: (opsional) atur peluang tiap ukuran, mis. {"300x250": 3}
                artinya 300x250 3x lebih sering muncul dari yang lain.       */
    banner: {
      enabled: true,
      sizes: [
        { id: "728x90",  width: 728, height: 90,  device: "both" },  // Leaderboard
        { id: "468x60",  width: 468, height: 60,  device: "both" },  // Full Banner
        { id: "160x600", width: 160, height: 600, device: "both" },  // Wide Skyscraper
        { id: "300x250", width: 300, height: 250, device: "both" },  // Medium Rectangle
        { id: "160x300", width: 160, height: 300, device: "both" },  // Small Rectangle-ish
        { id: "320x50",  width: 320, height: 50,  device: "both" }   // Mobile Leaderboard
      ],
      rotate:  true,
      sticky:  true,
      weights: {}
    },
    native:   { enabled: true },
    social:   { enabled: true },
    popunder: { enabled: false },

    /* ---- ROTATOR — pasang semua kode iklan, pengunjung lihat SATU tipe ----
       Kamu tempel semua kode sekaligus di <template>, lalu tiap pengunjung
       diberi satu tipe saja secara acak. Tidak perlu bolak-balik ganti kode.

       enabled : true = rotator nyala | false = semua tipe tampil bersamaan
       types   : tipe yang ikut diundi. Hapus dari daftar = tidak pernah terpilih.
       weights : peluang munculnya. Angka lebih besar = lebih sering.
                 Contoh { banner:3, native:1, social:1 }
                 → banner 3x lebih sering muncul daripada native atau social.
       always  : tipe yang SELALU tampil untuk semua pengunjung, di luar undian.
                 Contoh ["popunder"] → pop under jalan terus, sisanya diacak.
       sticky  : true = pengunjung yang sama tetap dapat tipe yang sama selama
                 tab browsernya belum ditutup (tidak berganti saat refresh).

       Tipe yang kodenya masih kosong otomatis tidak ikut diundi, jadi
       pengunjung tidak pernah mendapat slot kosong.
       Cek hasilnya: buka Console browser, ada tulisan [ads] rotator.
       Mau memaksa satu tipe saat mengetes? Pakai ?ads=native di link —
       itu selalu mengalahkan rotator.                                        */
    rotate: {
      enabled: true,
      types:   ["banner", "native", "social"],
      weights: { banner: 1, native: 1, social: 1 },
      always:  [],
      sticky:  true
    }
  },

  /* ---------- 7. LINK DI FOOTER ----------
     Setiap item membuka artikel popup (kunci "article" → lihat ARTIKEL).
     Mau link biasa? Ganti  article: "..."  dengan  href: "https://..."          */
  footer: [
    { title: "Links", links: [
      { label: "About", article: "tentang" },
      { label: "Contact", article: "kontak" },
      { label: "FAQ", article: "faq" }
    ]},
    { title: "Legal", links: [
      { label: "Privacy Policy",     article: "privasi" },
      { label: "Terms & Conditions", article: "syarat"  },
      { label: "DMCA",               article: "dmca"    }
    ]}
  ],

  /* ---------- 8. DAFTAR VIDEO ----------
     id      = kode setelah "v=" di link YouTube (youtube.com/watch?v=KODE_INI)
     title / channel / desc = teks yang tampil
     live    = true → ada badge LIVE
     link    = tujuan tombol di popup. Kosongkan ("") = otomatis ke video YouTube ini
     thumb   = (opsional) link gambar sampul sendiri. Kosongkan = pakai sampul YouTube
     Video pertama = video utama.                                               */
  videos: [
    {
      id: "jfKfPfyJRdk", live: true,
      title: "Sample 24/7 live stream",
      channel: "Channel Name",
      desc: "Replace this text with the description of your first video.",
      link: "", thumb: ""
    },
    {
      id: "5qap5aO4i9A", live: true,
      title: "Sample video number two",
      channel: "Channel Name",
      desc: "Description of the second video.",
      link: "", thumb: ""
    },
    {
      id: "4xDzrJKXOOY", live: false,
      title: "Sample video number three",
      channel: "Channel Name",
      desc: "Description of the third video.",
      link: "", thumb: ""
    }
  ],

  /* ---------- 9. ARTIKEL (isi popup) ----------
     Kunci (tentang, kontak, ...) harus sama dengan "article" di menu/footer.
     Isi memakai HTML sederhana: <p> paragraf, <h3> judul kecil, <ul><li> daftar.
     Semua ini CONTOH — ganti dengan isi milikmu sendiri.                       */
  articles: {

    tentang: {
      title: "About Us",
      body: `
        <p>SiteName is a simple page for watching featured videos and live streams in one place. We collect interesting videos so you don't have to search for them one by one.</p>
        <h3>What we do</h3>
        <p>We pick videos from a variety of channels, present them neatly, and point you to the original source on YouTube. All rights to the videos remain with their respective channel owners.</p>
        <h3>Why we built it</h3>
        <p>This page is designed to be lightweight and comfortable to open on your phone, even on a slower connection. No extra app needed.</p>
        <p>Have a suggestion or feedback? Reach out through the Contact page.</p>`
    },

    kontak: {
      title: "Contact",
      body: `
        <p>We'd love to hear from you. Feel free to get in touch about any of the following:</p>
        <ul>
          <li>General questions about the site</li>
          <li>Reporting a link or video that doesn't work</li>
          <li>Partnership inquiries</li>
          <li>Content removal requests (see the DMCA page)</li>
        </ul>
        <h3>Email</h3>
        <p>contact@yoursite.com</p>
        <h3>Response time</h3>
        <p>We aim to reply within 1–3 business days. Please include a clear description so we can help you faster.</p>`
    },

    faq: {
      title: "Frequently Asked Questions",
      body: `
        <h3>Is watching here free?</h3>
        <p>Yes. You can open this page at no cost. The videos themselves are played from YouTube and follow YouTube's rules.</p>
        <h3>Why can't I open a video?</h3>
        <p>Some videos are restricted by their owners or unavailable in certain regions. Try reloading the page, or open the video directly on YouTube.</p>
        <h3>Do I need to create an account?</h3>
        <p>No. You can watch without an account.</p>
        <h3>Why are there ads on this page?</h3>
        <p>Ads help us keep the site running without charging visitors.</p>
        <h3>How do I report a problem?</h3>
        <p>Send us an email through the Contact page and describe the problem as clearly as you can.</p>`
    },

    privasi: {
      title: "Privacy Policy",
      body: `
        <p><em>Last updated: September 20, 2026</em></p>
        <p>Your privacy matters to us. This page explains what information may be collected when you use this site and how it is used.</p>
        <h3>Information we collect</h3>
        <p>We do not ask for personal data in order to watch. Like most websites, our servers and analytics services may record basic technical data such as device type, browser, and the pages you open.</p>
        <h3>Cookies</h3>
        <p>This site and the third-party services we use may set cookies to keep the site working, measure visits, and show ads. You can manage or delete cookies in your browser settings.</p>
        <h3>Third-party advertising</h3>
        <p>We may show ads from third-party ad networks. They may use cookies to show relevant ads based on your visits to this site and other sites.</p>
        <h3>Third-party services</h3>
        <p>Videos come from YouTube. When you open YouTube, YouTube's own privacy policy applies.</p>
        <h3>Contact</h3>
        <p>Questions about this policy can be sent to contact@yoursite.com.</p>`
    },

    syarat: {
      title: "Terms & Conditions",
      body: `
        <p><em>Last updated: September 20, 2026</em></p>
        <p>By opening and using this site, you agree to the following terms.</p>
        <h3>Use of the site</h3>
        <p>This site is provided for personal, non-commercial use. You may not misuse the site, disrupt the service, or try to access our systems without permission.</p>
        <h3>Third-party content</h3>
        <p>The videos and other material shown come from third parties and remain the property of their owners. We do not claim ownership of that content.</p>
        <h3>External links</h3>
        <p>This site may contain links to other websites. We are not responsible for the content or policies of those sites.</p>
        <h3>Limitation of liability</h3>
        <p>The site is provided "as is". We do not guarantee that the service will always be available without interruption or free of errors.</p>
        <h3>Changes</h3>
        <p>These terms may be updated at any time. Continued use of the site after changes means you accept the new terms.</p>`
    },

    dmca: {
      title: "DMCA",
      body: `
        <p>We respect copyright. If you are a copyright owner and believe that material on this site infringes your rights, please send us a written notice.</p>
        <h3>What to include</h3>
        <ul>
          <li>Your name and contact information</li>
          <li>A description of the copyrighted work</li>
          <li>The address (URL) of the page you believe is infringing</li>
          <li>A statement that you own the rights or are authorized to act on the owner's behalf</li>
        </ul>
        <h3>Send to</h3>
        <p>dmca@yoursite.com</p>
        <p>Once a valid notice is received, we will act on it as quickly as possible, including removing the link in question.</p>`
    }
  }
};
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070A12;
    --surface:#0D1322;
    --surface-2:#131B2F;
    --line:rgba(0,212,255,.16);
    --text:#EAF2FF;
    --muted:#93A0BC;
    --p:#00D4FF;      /* warna utama  — ganti di sini */
    --s:#0099FF;      /* warna kedua  — ganti di sini */
    --live:#FF3B3B;
    --radius-lg:20px;
    --radius-md:12px;
    --radius-sm:8px;
    --wrap:1200px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    /* lapisan 1 = cahaya biru, lapisan 2 = gambar background (diatur di SITE.theme.page) */
    background-color:var(--page-bg,var(--bg));
    background-image:var(--page-glow,none),var(--page-img,none);
    background-size:auto,var(--page-size,cover);
    background-position:50% -120px,var(--page-pos,center);
    background-repeat:no-repeat,var(--page-repeat,no-repeat);
    background-attachment:fixed,var(--page-attach,fixed);
    color:var(--text);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  /* penggelap gambar background halaman (SITE.theme.page.dim) */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:#000;opacity:var(--page-dim,0);
  }
  body.modal-open{overflow:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  a,button{-webkit-tap-highlight-color:transparent}
  .btn,.card,.poster,.menu-toggle,.modal-close{touch-action:manipulation}
  :focus-visible{outline:2px solid var(--p);outline-offset:3px;border-radius:6px}
  .wrap{max-width:var(--wrap);margin:0 auto;padding-inline:20px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- Header ---------- */
  .site-header{
    position:sticky;top:0;z-index:50;
    background:rgba(13,19,34,.72);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
  .logo svg{flex:none}
  .logo span{
    background:linear-gradient(90deg,var(--p),var(--s));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .nav{display:flex;align-items:center;gap:28px}
  .nav > a{color:var(--muted);font-size:14px;font-weight:500;transition:color .2s}
  .nav > a:hover{color:var(--p)}
  .auth{display:flex;gap:10px;margin-left:8px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:44px;padding:9px 20px;border-radius:var(--radius-sm);white-space:nowrap;
    font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent;
    transition:transform .2s, box-shadow .2s, background .2s, color .2s;
  }
  .btn-outline{border-color:var(--p);color:var(--text)}
  .btn-outline:hover{background:var(--p);color:#001018}
  .btn-solid{background:linear-gradient(90deg,var(--p),var(--s));color:#001018}
  .btn-solid:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,212,255,.35)}
  .btn-lg{width:100%;min-height:54px;font-size:16px;font-weight:800;border-radius:var(--radius-md)}
  .menu-toggle{
    display:none;width:44px;height:44px;border-radius:var(--radius-sm);
    background:var(--surface-2);border:1px solid var(--line);cursor:pointer;
    align-items:center;justify-content:center;
  }

  /* ---------- Area iklan ---------- */
  .ad-wrap{padding-top:16px}
  .ad-wrap[hidden]{display:none}
  .ad-label{display:block;text-align:center;font-size:11px;color:var(--muted);opacity:.7;margin-bottom:5px}
  .ad-slot{
    display:flex;justify-content:center;align-items:center;
    max-width:100%;margin:0 auto;overflow:hidden;
  }
  #adNative{display:block;width:100%}
  #adNative[data-ph]{display:flex}
  .ad-frame{overflow:hidden}
  .ad-slot[data-ph]{
    width:100%;min-height:90px;padding:10px;text-align:center;
    border:1px dashed rgba(0,212,255,.35);border-radius:var(--radius-sm);
    background:rgba(0,212,255,.04);color:var(--muted);font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .ad-slot[data-ph]::before{content:attr(data-ph)}
  #nativeWrap{margin-top:6px}

  /* ---------- Judul video ---------- */
  .now{padding-block:20px 16px}
  .now-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .pill-live{
    display:inline-flex;align-items:center;gap:7px;
    padding:4px 11px;border-radius:999px;
    background:rgba(255,59,59,.14);border:1px solid rgba(255,59,59,.5);
    color:#FF8C8C;font-size:12px;font-weight:800;letter-spacing:.04em;
  }
  .pill-live::before{
    content:"";width:8px;height:8px;border-radius:50%;background:var(--live);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .pill-live[hidden]{display:none}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .now h1{
    margin:10px 0 0;
    font-size:clamp(22px,3.2vw,36px);line-height:1.2;font-weight:800;letter-spacing:-.025em;
  }
  .now-meta{margin:6px 0 0;color:var(--muted);font-size:14px}

  /* ---------- Area streaming (background di sekeliling video) ---------- */
  .stage{
    position:relative;padding:var(--stage-pad,0px);border-radius:var(--radius-lg);
    background-color:var(--stage-bg,transparent);
    background-image:var(--stage-img,none);
    background-size:var(--stage-size,cover);
    background-position:var(--stage-pos,center);
    background-repeat:var(--stage-repeat,no-repeat);
  }
  .stage::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:#000;opacity:var(--stage-dim,0);
  }
  .stage.full{                       /* melebar sampai tepi layar */
    margin-inline:calc(50% - 50vw + var(--sbw,0px) / 2);
    padding-inline:calc(50vw - var(--sbw,0px) / 2 - 50% + var(--stage-pad,0px));
    border-radius:0;
  }
  .stage > .player{z-index:1}

  /* ---------- Player ---------- */
  .player{
    position:relative;aspect-ratio:16/9;background:var(--video-bg,#000);
    border-radius:var(--radius-lg);overflow:hidden;
    box-shadow:0 0 0 1px var(--line), 0 0 60px rgba(0,212,255,.16), 0 30px 60px rgba(0,0,0,.5);
  }
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .poster{
    position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;cursor:pointer;
    background:var(--video-bg,#05070d) center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;
  }
  .poster::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(5,8,16,.75),rgba(5,8,16,.15) 55%);
  }
  .play-btn{
    position:relative;width:96px;height:96px;border-radius:50%;
    background:linear-gradient(135deg,var(--p),var(--s));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 40px rgba(0,212,255,.4);
    transition:transform .2s, box-shadow .2s;
  }
  .poster:hover .play-btn{transform:scale(1.08);box-shadow:0 16px 50px rgba(0,212,255,.6)}
  .play-btn::after{
    content:"";margin-left:6px;transition:opacity .3s;
    border-left:28px solid #001018;border-top:17px solid transparent;border-bottom:17px solid transparent;
  }
  /* lingkaran loading (tanpa teks) */
  .ring{
    position:absolute;left:50%;top:50%;width:134%;height:134%;
    transform:translate(-50%,-50%) rotate(-90deg);
    opacity:0;transition:opacity .25s;pointer-events:none;overflow:visible;
  }
  .ring circle{fill:none;stroke-width:4}
  .ring-bg{stroke:rgba(255,255,255,.18)}
  .ring-fg{stroke:var(--p);stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(0,212,255,.8))}
  .player.loading .ring{opacity:1}
  .player.loading .poster{cursor:progress}
  .player.loading .play-btn{transform:scale(1);animation:breathe 1.4s ease-in-out infinite}
  .player.loading .play-btn::after{opacity:.3}
  @keyframes breathe{0%,100%{box-shadow:0 12px 40px rgba(0,212,255,.35)}50%{box-shadow:0 12px 56px rgba(0,212,255,.75)}}

  /* ---------- Deskripsi ---------- */
  .about{
    margin-top:18px;padding:18px 20px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
    color:var(--muted);font-size:15px;
  }
  .about p{margin:0;max-width:72ch}

  /* ---------- Video lainnya ---------- */
  .more{padding-block:40px 56px}
  .more h2{margin:0 0 18px;font-size:20px;font-weight:800;letter-spacing:-.015em}
  .grid{
    display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    margin:0;padding:0;list-style:none;
  }
  .card{display:block;width:100%;text-align:left;cursor:pointer;background:transparent;border:0;padding:0}
  .thumb{
    position:relative;aspect-ratio:16/9;border-radius:var(--radius-md);overflow:hidden;
    background:var(--surface-2) center/cover no-repeat;
    box-shadow:0 0 0 1px rgba(255,255,255,.06);
    transition:box-shadow .2s, transform .2s;
  }
  .card:hover .thumb{box-shadow:0 0 0 2px var(--p);transform:translateY(-2px)}
  .card[aria-current="true"] .thumb{box-shadow:0 0 0 2px var(--p), 0 0 24px rgba(0,212,255,.35)}
  .card .tag{
    position:absolute;left:8px;bottom:8px;
    padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;
    background:var(--live);color:#fff;
  }
  .card h3{margin:10px 0 2px;font-size:15px;font-weight:600;line-height:1.35}
  .card small{color:var(--muted);font-size:13px}

  /* ---------- Footer ---------- */
  .site-footer{border-top:1px solid var(--line);background:rgba(13,19,34,.6);padding:40px 0 28px}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
  .footer-brand strong{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .footer-brand p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:34ch}
  .footer-col h4{margin:0 0 12px;font-size:14px;font-weight:600}
  .footer-col a,.footer-col button{
    display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    color:var(--muted);font-size:14px;padding:6px 0;transition:color .2s;
  }
  .footer-col a:hover,.footer-col button:hover{color:var(--p)}
  .footer-bottom{margin-top:32px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);color:var(--muted);font-size:13px}

  /* ---------- Popup ---------- */
  .modal{
    position:fixed;inset:0;z-index:2000;
    display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(3,6,12,.78);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    animation:fade .2s ease;
  }
  .modal[hidden]{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .modal-card{
    position:relative;width:100%;max-width:640px;
    max-height:min(84vh,760px);max-height:min(84dvh,760px);
    display:flex;flex-direction:column;overflow:hidden;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 40px rgba(0,212,255,.08);
    animation:rise .25s ease;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 14px 14px 26px;border-bottom:1px solid var(--line);flex:none;
  }
  .modal-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.3}
  .modal-close{
    flex:none;width:44px;height:44px;border-radius:50%;cursor:pointer;
    background:var(--surface-2);border:1px solid rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s;
  }
  .modal-close:hover{border-color:var(--p);color:var(--p)}
  .modal-body{overflow-y:auto;overscroll-behavior:contain;padding:20px 26px 28px;-webkit-overflow-scrolling:touch}
  .article{color:#C6D0E6;font-size:15px;line-height:1.75}
  .article p{margin:0 0 14px}
  .article h3{margin:22px 0 6px;font-size:16px;font-weight:800;color:var(--text)}
  .article ul{margin:0 0 14px;padding-left:20px}
  .article li{margin-bottom:6px}
  .article em{color:var(--muted)}
  .article > :last-child{margin-bottom:0}

  /* popup "watch" */
  .modal-card.small{max-width:400px;text-align:center;padding:40px 26px 28px;overflow:visible}
  .modal-card.small .modal-close{position:absolute;top:10px;right:10px}
  .done-ic{
    width:72px;height:72px;margin:0 auto 18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--p),var(--s));
    box-shadow:0 10px 36px rgba(0,212,255,.45);
  }
  .modal-card.small h2{margin:0 0 22px;font-size:24px;font-weight:800;letter-spacing:-.02em}

  /* ---------- Responsif ---------- */
  @media (min-width:821px){
    .nav{gap:28px}
  }
  @media (max-width:820px){
    .menu-toggle{display:inline-flex}
    .nav{
      position:absolute;left:0;right:0;top:100%;
      flex-direction:column;align-items:stretch;gap:0;
      background:#0D1322;border-bottom:1px solid var(--line);box-shadow:0 20px 40px rgba(0,0,0,.5);
      padding:8px 20px 18px;display:none;
    }
    .nav.open{display:flex}
    .nav > a{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
    .auth{margin:14px 0 0}
    .auth .btn{flex:1}
    .footer-grid{grid-template-columns:1fr 1fr}
    .footer-brand{grid-column:1 / -1}
  }
  @media (max-width:560px){
    .site-header{padding-top:env(safe-area-inset-top)}
    .header-row{height:60px}
    .wrap{padding-inline:14px}
    .player{border-radius:14px}
    .stage:not(.full){border-radius:14px}
    .play-btn{width:72px;height:72px}
    .play-btn::after{border-left-width:22px;border-top-width:13px;border-bottom-width:13px;margin-left:5px}
    .footer-col a,.footer-col button{padding:12px 0}
    .site-footer{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
    .ad-slot[data-ph]{min-height:50px}
    /* artikel: muncul dari bawah seperti lembar */
    .modal:not(.center){align-items:flex-end;padding:0}
    .modal:not(.center) .modal-card{
      max-width:none;border-radius:20px 20px 0 0;border-bottom:0;
      max-height:88vh;max-height:88dvh;
    }
    .modal-head{padding-left:20px}
    .modal-body{padding:18px 20px calc(28px + env(safe-area-inset-bottom))}
  }
  @media (max-height:480px) and (orientation:landscape){
    .now{padding-block:12px 8px}
    .now h1{font-size:20px}
    .player{max-height:78vh;margin-inline:auto}
    .modal-card,.modal:not(.center) .modal-card{max-height:92vh;max-height:92dvh}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="wrap header-row">
    <a class="logo" href="#" aria-label="Home">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00D4FF"/><stop offset="1" stop-color="#0099FF"/></linearGradient></defs>
        <rect width="30" height="30" rx="8" fill="url(#lg)"/>
        <path d="M11.5 8.8v12.4L21.5 15z" fill="#001018"/>
      </svg>
      <span id="logoText">SiteName</span>
    </a>

    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-controls="nav" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>

    <!-- isi menu & tombol dibuat otomatis dari PENGATURAN (SITE.nav & SITE.buttons) -->
    <nav class="nav" id="nav" aria-label="Main menu"></nav>
  </div>
</header>

<main>
  <!-- ============ SLOT BANNER (bawah garis header) ============
       Diisi otomatis dari salah satu <template id="ad-banner-..."> di atas (dirotasi).
       (Boleh juga menempel kode langsung di dalam <div id="adTop"></div>.) -->
  <div class="wrap ad-wrap" id="adWrap">
    <span class="ad-label">Advertisement</span>
    <div class="ad-slot" id="adTop"></div>
  </div>

  <!-- ============ VIDEO UTAMA ============ -->
  <section class="wrap now" id="tonton" aria-labelledby="videoTitle">
    <div class="now-top">
      <span class="pill-live" id="liveBadge" hidden>LIVE</span>
    </div>
    <h1 id="videoTitle">Loading…</h1>
    <p class="now-meta" id="videoMeta"></p>
  </section>

  <div class="wrap">
    <!-- ============ AREA STREAMING ============
         Warna / gambar background area ini diatur di SITE.theme.stage -->
    <div class="stage" id="stage">
      <div class="player" id="player"></div>
    </div>
    <p class="sr-only" id="playerStatus" role="status" aria-live="polite"></p>

    <div class="about">
      <p id="videoDesc"></p>
    </div>

    <!-- ============ SLOT NATIVE BANNER (bawah deskripsi) ============
         Diisi otomatis dari <template id="ad-native"> di atas. -->
    <div class="ad-wrap" id="nativeWrap">
      <span class="ad-label">Advertisement</span>
      <div class="ad-slot" id="adNative"></div>
    </div>
  </div>

  <!-- ============ VIDEO LAINNYA ============ -->
  <section class="wrap more" id="video-lain" aria-labelledby="moreTitle">
    <h2 id="moreTitle">More videos</h2>
    <ul class="grid" id="grid"></ul>
  </section>
</main>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid" id="footerGrid">
      <div class="footer-brand">
        <strong id="footName"></strong>
        <p id="footTag"></p>
      </div>
    </div>
    <div class="footer-bottom" id="footCopy"></div>
  </div>
</footer>

<!-- ============ POPUP ARTIKEL ============ -->
<div class="modal" id="articleModal" role="dialog" aria-modal="true" aria-labelledby="articleTitle" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="articleTitle"></h2>
      <button class="modal-close" type="button" data-close aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg>
      </button>
    </div>
    <div class="modal-body"><div class="article" id="articleBody"></div></div>
  </div>
</div>

<!-- ============ POPUP "WATCH YOUR VIDEO" ============ -->
<div class="modal center" id="watchModal" role="dialog" aria-modal="true" aria-labelledby="watchTitle" hidden>
  <div class="modal-card small">
    <button class="modal-close" type="button" data-close aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg>
    </button>
    <div class="done-ic" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#001018" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h2 id="watchTitle"></h2>
    <a class="btn btn-solid btn-lg" id="watchBtn" data-autofocus href="#"></a>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const player = $("#player");
const grid = $("#grid");
let current = 0;
let state = "idle";     // idle | loading | done
let raf = 0;

/* ---------- Header: nama, menu, tombol ---------- */
document.title = SITE.name;
$("#logoText").textContent = SITE.name;

function linkAttrs(item) {
  if (item.article) return `href="#" data-article="${esc(item.article)}"`;
  const tab = item.newTab ? ' target="_blank" rel="noopener noreferrer"' : "";
  return `href="${esc(item.href || "#")}"${tab}`;
}
$("#nav").innerHTML =
  SITE.nav.map((n) => `<a ${linkAttrs(n)}>${esc(n.label)}</a>`).join("") +
  `<div class="auth">` +
  SITE.buttons.map((b) =>
    `<a class="btn btn-${b.style === "solid" ? "solid" : "outline"}" ${linkAttrs(b)}>${esc(b.label)}</a>`
  ).join("") +
  `</div>`;

/* =========================================================
   TAMPILAN — warna & background (dari SITE.theme)
   ========================================================= */
(function applyTheme(){
  const t = SITE.theme || {};
  const root = document.documentElement.style;
  const url = (u) => u ? 'url("' + String(u).replace(/"/g, "%22") + '")' : "none";
  const num = (v) => Math.min(1, Math.max(0, Number(v) || 0));

  const c = t.colors || {};
  if (c.primary)   root.setProperty("--p", c.primary);
  if (c.secondary) root.setProperty("--s", c.secondary);
  const stops = document.querySelectorAll("#lg stop");           // logo ikut warna
  if (stops.length === 2) {
    if (c.primary)   stops[0].setAttribute("stop-color", c.primary);
    if (c.secondary) stops[1].setAttribute("stop-color", c.secondary);
  }

  const p = t.page || {};
  if (p.color) {
    root.setProperty("--page-bg", p.color);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", p.color);
  }
  root.setProperty("--page-img", url(p.image));
  root.setProperty("--page-size", p.size || "cover");
  root.setProperty("--page-pos", p.position || "center");
  root.setProperty("--page-repeat", p.repeat || "no-repeat");
  root.setProperty("--page-attach", p.fixed === false ? "scroll" : "fixed");
  root.setProperty("--page-dim", p.image ? num(p.dim) : 0);
  root.setProperty("--page-glow", p.glow === false ? "none"
    : "radial-gradient(900px 420px at 50% -120px, rgba(0,153,255,.22), transparent 70%)");

  const s = t.stage || {};
  root.setProperty("--stage-bg", s.color || "transparent");
  root.setProperty("--stage-img", url(s.image));
  root.setProperty("--stage-size", s.size || "cover");
  root.setProperty("--stage-pos", s.position || "center");
  root.setProperty("--stage-repeat", s.repeat || "no-repeat");
  root.setProperty("--stage-dim", s.image ? num(s.dim) : 0);
  root.setProperty("--stage-pad", (Number(s.pad) || 0) + "px");
  root.setProperty("--video-bg", s.videoBg || s.color || "#000");
  if (s.full) {
    $("#stage").classList.add("full");
    const sbw = () => root.setProperty("--sbw",
      (window.innerWidth - document.documentElement.clientWidth) + "px");   // lebar scrollbar desktop
    sbw();
    addEventListener("resize", sbw);
  }
})();

/* --- ?sizes=1 : panduan ukuran gambar sesuai layar yang sedang dipakai --- */
if (/(^|[?&])sizes(=|&|$)/.test(location.search)) {
  const box = document.createElement("div");
  box.style.cssText =
    "position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3000;" +
    "max-width:420px;margin:0 auto;padding:12px 14px;border-radius:12px;" +
    "background:rgba(7,10,18,.94);border:1px solid rgba(0,212,255,.45);color:#EAF2FF;" +
    "font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 12px 40px rgba(0,0,0,.6)";
  document.body.appendChild(box);
  const draw = () => {
    const dpr = window.devicePixelRatio || 1;
    const w = innerWidth, h = innerHeight;
    const st = $("#stage").getBoundingClientRect();
    const r = (n) => Math.round(n / 2) * 2;
    const mobileNow = w <= SITE.ads.mobileBreakpoint;
    const bannerNow = (SITE.ads.banner.sizes || []).filter((v) =>
      (v.device || "both") === (mobileNow ? "mobile" : "desktop") || (v.device || "both") === "both");
    box.innerHTML =
      "<b style='color:#00D4FF'>Panduan ukuran gambar</b><br>" +
      "Layar: " + w + " × " + h + " px &nbsp;(kerapatan " + dpr.toFixed(1) + "×) — dianggap " +
      (mobileNow ? "HP" : "desktop") + "<br><br>" +
      "<b>Background halaman</b><br>pas di layar ini: " + r(w * dpr) + " × " + r(h * dpr) + " px<br>" +
      "aman semua perangkat: 1920 × 1280 px<br><br>" +
      "<b>Background area streaming</b><br>area sekarang: " + Math.round(st.width) + " × " + Math.round(st.height) + " px<br>" +
      "pas di layar ini: " + r(st.width * dpr) + " × " + r(st.height * dpr) + " px<br>" +
      "aman (16:9): 1280 × 720 px<br><br>" +
      "<b>Banner iklan</b><br>ukuran yang bisa tampil di perangkat ini:<br>" +
      (bannerNow.map((v) => v.width + " × " + v.height).join(", ") || "(tidak ada)") + "<br><br>" +
      "<span style='color:#93A0BC'>Panel ini hanya muncul saat ada ?sizes=1 di link.</span>";
  };
  draw();
  addEventListener("resize", draw);
  addEventListener("orientationchange", () => setTimeout(draw, 300));
}

/* ---------- Footer ---------- */
$("#footName").textContent = SITE.name;
$("#footTag").textContent = SITE.tagline;
$("#footCopy").textContent = `© ${SITE.year} ${SITE.name}. All rights reserved.`;
SITE.footer.forEach((col) => {
  const d = document.createElement("div");
  d.className = "footer-col";
  d.innerHTML = `<h4>${esc(col.title)}</h4>` + col.links.map((l) =>
    l.article
      ? `<button type="button" data-article="${esc(l.article)}">${esc(l.label)}</button>`
      : `<a ${linkAttrs(l)}>${esc(l.label)}</a>`
  ).join("");
  $("#footerGrid").appendChild(d);
});

/* =========================================================
   IKLAN — banner, native, social bar, pop under
   ========================================================= */
const AD_PARAM = new URLSearchParams(location.search).get("ads");   // ?ads=banner,native
const AD_LIST = AD_PARAM === null ? null : AD_PARAM.toLowerCase().split(",").map((s) => s.trim());
let ROT_PICK = null;          // tipe iklan terpilih untuk pengunjung ini (lihat pickAdType di bawah)
const adOn = (type) => {
  const c = SITE.ads[type];
  if (!c || !c.enabled) return false;
  if (AD_LIST !== null) return AD_LIST.includes(type);          // ?ads=... mengalahkan rotator
  if (ROT_PICK && type !== ROT_PICK &&
      !((SITE.ads.rotate && SITE.ads.rotate.always) || []).includes(type)) return false;
  return true;
};
const adCode = (id) => {
  const t = document.getElementById(id);
  return t ? t.innerHTML.replace(/<!--[\s\S]*?-->/g, "").trim() : "";
};
const SHOW_PH = SITE.ads.showPlaceholder || /(^|[?&])adpreview(=|&|$)/.test(location.search);

/* --- ROTATOR: undi satu tipe iklan untuk pengunjung ini --- */
function pickAdType() {
  const r = SITE.ads.rotate;
  if (!r || !r.enabled || AD_LIST !== null) return null;
  const hasCode = (t) => t === "banner"
    ? (SITE.ads.banner.sizes || []).some((v) => adCode("ad-banner-" + v.id))
    : !!adCode("ad-" + t);
  const always = r.always || [];
  const pool = (r.types || []).filter((t) =>
    SITE.ads[t] && SITE.ads[t].enabled && !always.includes(t) && (hasCode(t) || SHOW_PH));
  if (!pool.length) return null;
  if (r.sticky !== false) {
    try {
      const saved = sessionStorage.getItem("adpick");
      if (pool.includes(saved)) return saved;
    } catch (e) {}
  }
  const wt = (t) => (Number((r.weights || {})[t]) > 0 ? Number(r.weights[t]) : 1);
  let n = Math.random() * pool.reduce((a, t) => a + wt(t), 0);
  let pick = pool[pool.length - 1];
  for (const t of pool) { n -= wt(t); if (n <= 0) { pick = t; break; } }
  if (r.sticky !== false) { try { sessionStorage.setItem("adpick", pick); } catch (e) {} }
  return pick;
}
ROT_PICK = pickAdType();
if (ROT_PICK) console.info("[ads] rotator: pengunjung ini melihat tipe \"" + ROT_PICK + "\"" +
  ((SITE.ads.rotate.always || []).length ? " + selalu: " + SITE.ads.rotate.always.join(", ") : ""));
const whenLoaded = (fn) =>
  document.readyState === "complete" ? fn() : window.addEventListener("load", fn, { once: true });

/* tempel kode ke halaman & jalankan script-nya */
function injectCode(target, code, label) {
  try {
    const r = document.createRange();
    r.selectNodeContents(target);
    target.appendChild(r.createContextualFragment(code));
  } catch (e) {
    console.warn("[ads] failed to load " + label, e);
  }
}

const activeAds = new Set();

/* --- Banner: dipasang di dalam iframe supaya kode iklan berukuran tetap
       (document.write, atOptions, dll) berjalan normal & tidak saling bentrok --- */
const bannerWrap = $("#adWrap"), bannerSlot = $("#adTop");
const bannerMQ = matchMedia(`(max-width:${SITE.ads.mobileBreakpoint}px)`);
let bannerFit = null;

/* Pilih SATU ukuran banner untuk pengunjung ini, dari ukuran yang cocok
   dengan perangkatnya (desktop/mobile/both) dan sudah terisi kodenya. */
function pickBannerSize(mobile) {
  const b = SITE.ads.banner;
  const device = mobile ? "mobile" : "desktop";
  const list = (b.sizes || []).filter((v) => (v.device || "both") === device || (v.device || "both") === "both");
  const filled = list.filter((v) => adCode("ad-banner-" + v.id));
  const pool = filled.length ? filled : (SHOW_PH ? list : []);
  if (!pool.length) return null;
  if (b.rotate === false) return pool[0];
  const key = "bannersize_" + device;
  if (b.sticky !== false) {
    try {
      const saved = sessionStorage.getItem(key);
      const hit = pool.find((v) => v.id === saved);
      if (hit) return hit;
    } catch (e) {}
  }
  const wt = (v) => (Number((b.weights || {})[v.id]) > 0 ? Number(b.weights[v.id]) : 1);
  let n = Math.random() * pool.reduce((a, v) => a + wt(v), 0);
  let pick = pool[pool.length - 1];
  for (const v of pool) { n -= wt(v); if (n <= 0) { pick = v; break; } }
  if (b.sticky !== false) { try { sessionStorage.setItem(key, pick.id); } catch (e) {} }
  return pick;
}

function renderBanner() {
  if (bannerFit) { removeEventListener("resize", bannerFit); bannerFit = null; }
  if (!adOn("banner")) { bannerWrap.hidden = true; return; }
  if (bannerSlot.dataset.manual) return;
  if (!bannerSlot.dataset.managed && bannerSlot.childElementCount > 0) {   // kode ditempel langsung di HTML
    bannerSlot.dataset.manual = "1";
    activeAds.add("banner (manual)");
    return;
  }
  const mobile = bannerMQ.matches;
  const variant = pickBannerSize(mobile);
  bannerSlot.dataset.managed = "1";
  bannerSlot.innerHTML = "";
  bannerSlot.removeAttribute("data-ph");
  bannerWrap.hidden = false;

  if (!variant) { bannerWrap.hidden = true; return; }   // tidak ada ukuran yang cocok/terisi untuk perangkat ini
  const size = variant, code = adCode("ad-banner-" + variant.id);
  bannerSlot.style.minHeight = size.height + "px";

  if (!code) {
    if (SHOW_PH) bannerSlot.dataset.ph = `Banner ad space — ${size.width}×${size.height}`;
    else bannerWrap.hidden = true;
    return;
  }
  const box = document.createElement("div");
  box.className = "ad-frame";
  const f = document.createElement("iframe");
  f.width = size.width; f.height = size.height;
  f.title = "Advertisement";
  f.setAttribute("scrolling", "no");
  f.style.cssText = "border:0;display:block;transform-origin:0 0;max-width:none";
  f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><base target="_blank">' +
             '<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}</style></head><body>' +
             code + "</body></html>";
  box.appendChild(f);
  bannerSlot.appendChild(box);
  activeAds.add("banner (" + size.width + "×" + size.height + ")");
  bannerFit = () => {                     // kecilkan otomatis kalau layar lebih sempit dari banner
    const s = Math.min(1, bannerSlot.clientWidth / size.width);
    f.style.transform = `scale(${s})`;
    box.style.width = size.width * s + "px";
    box.style.height = size.height * s + "px";
    bannerSlot.style.minHeight = size.height * s + "px";
  };
  bannerFit();
  addEventListener("resize", bannerFit);
}
renderBanner();
bannerMQ.addEventListener("change", renderBanner);   // HP diputar → pilih ulang ukuran yang cocok

/* --- Native banner --- */
(function () {
  const wrap = $("#nativeWrap"), slot = $("#adNative");
  if (!adOn("native")) { wrap.hidden = true; return; }
  const code = adCode("ad-native");
  if (!code) {
    if (SHOW_PH) slot.dataset.ph = "Native banner ad space";
    else wrap.hidden = true;
    return;
  }
  activeAds.add("native");
  whenLoaded(() => injectCode(slot, code, "native banner"));
})();

/* --- Social bar & pop under: hanya script, dipasang ke halaman --- */
[["social", "ad-social", "social bar"], ["popunder", "ad-popunder", "pop under"]].forEach(([type, id, label]) => {
  if (!adOn(type)) return;
  const code = adCode(id);
  if (!code) return;
  activeAds.add(type);
  whenLoaded(() => injectCode(document.body, code, label));
});
console.info("[ads] active:", activeAds.size ? [...activeAds].join(", ") : "none");

/* ---------- Popup (umum) ---------- */
let openEl = null, lastFocus = null;
function openModal(el) {
  lastFocus = document.activeElement;
  openEl = el;
  el.hidden = false;
  document.body.classList.add("modal-open");
  (el.querySelector("[data-autofocus]") || el.querySelector(".modal-close")).focus();
}
function closeModal() {
  if (!openEl) return;
  const el = openEl;
  openEl = null;
  el.hidden = true;
  document.body.classList.remove("modal-open");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
  if (el.id === "watchModal") resetPlayer();
}
document.querySelectorAll(".modal").forEach((m) => {
  m.addEventListener("click", (e) => { if (e.target === m) closeModal(); });
  m.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));
});
document.addEventListener("keydown", (e) => {
  if (!openEl) return;
  if (e.key === "Escape") { closeModal(); return; }
  if (e.key === "Tab") {
    const f = [...openEl.querySelectorAll("a[href],button:not([disabled])")];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- Artikel ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-article]");
  if (!t) return;
  e.preventDefault();
  const a = SITE.articles[t.dataset.article];
  if (!a) return;
  $("#articleTitle").textContent = a.title;
  $("#articleBody").innerHTML = a.body;
  $("#articleModal .modal-body").scrollTop = 0;
  closeMenu();
  openModal($("#articleModal"));
});

/* ---------- Player ---------- */
const RING_R = 54, RING_C = 2 * Math.PI * RING_R;
const thumbUrl = (v) => v.thumb || `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
const watchUrl = (v) => v.link || `https://www.youtube.com/watch?v=${v.id}`;

function showPoster(v) {
  cancelAnimationFrame(raf);
  state = "idle";
  player.classList.remove("loading");
  player.removeAttribute("aria-busy");
  player.innerHTML = "";
  const b = document.createElement("button");
  b.className = "poster";
  b.type = "button";
  b.setAttribute("aria-label", "Play: " + v.title);
  b.style.backgroundImage = `url("${thumbUrl(v)}")`;
  b.innerHTML =
    `<span class="play-btn">` +
    `<svg class="ring" viewBox="0 0 120 120" aria-hidden="true">` +
    `<circle class="ring-bg" cx="60" cy="60" r="${RING_R}"/>` +
    `<circle class="ring-fg" cx="60" cy="60" r="${RING_R}" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}"/>` +
    `</svg></span>`;
  b.addEventListener("click", startLoading);
  player.appendChild(b);
}

function startLoading() {
  if (state !== "idle") return;
  state = "loading";
  player.classList.add("loading");
  player.setAttribute("aria-busy", "true");
  $("#playerStatus").textContent = "Preparing your video…";
  const fg = player.querySelector(".ring-fg");
  const dur = Math.max(1, SITE.loadingSeconds) * 1000;
  const t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;   // halus di awal & akhir
    fg.style.strokeDashoffset = RING_C * (1 - e);
    if (p < 1) raf = requestAnimationFrame(step);
    else finishLoading();
  })(t0);
}

function finishLoading() {
  state = "done";
  const v = SITE.videos[current];
  $("#playerStatus").textContent = "Your video is ready.";
  if (SITE.afterLoading === "embed") { showIframe(v); return; }
  $("#watchTitle").textContent = SITE.watch.title;
  const btn = $("#watchBtn");
  btn.textContent = SITE.watch.button;
  btn.href = watchUrl(v);
  if (SITE.watch.newTab) { btn.target = "_blank"; btn.rel = "noopener noreferrer"; }
  else { btn.removeAttribute("target"); btn.removeAttribute("rel"); }
  openModal($("#watchModal"));
}

function resetPlayer() { showPoster(SITE.videos[current]); }

function showIframe(v) {
  player.classList.remove("loading");
  player.innerHTML = "";
  const f = document.createElement("iframe");
  f.src = `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1`;
  f.title = v.title;
  f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";
  f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  player.appendChild(f);
}

function select(i) {
  current = i;
  const v = SITE.videos[i];
  $("#videoTitle").textContent = v.title;
  $("#videoMeta").textContent = v.channel;
  $("#videoDesc").textContent = v.desc;
  $("#liveBadge").hidden = !v.live;
  document.title = v.title + " — " + SITE.name;
  grid.querySelectorAll(".card").forEach((c, idx) => {
    if (idx === i) c.setAttribute("aria-current", "true");
    else c.removeAttribute("aria-current");
  });
  showPoster(v);
  history.replaceState(null, "", "#v=" + v.id);
}

function buildGrid() {
  SITE.videos.forEach((v, i) => {
    const li = document.createElement("li");
    li.innerHTML =
      `<button class="card" type="button">` +
      `<div class="thumb" style="background-image:url('${esc(thumbUrl(v))}')">${v.live ? '<span class="tag">LIVE</span>' : ""}</div>` +
      `<h3></h3><small></small></button>`;
    li.querySelector("h3").textContent = v.title;
    li.querySelector("small").textContent = v.channel;
    li.querySelector(".card").addEventListener("click", () => {
      select(i);
      $("#tonton").scrollIntoView({ behavior: "smooth", block: "start" });
      startLoading();
    });
    grid.appendChild(li);
  });
}

/* ---------- Menu mobile ---------- */
const menuToggle = $("#menuToggle");
const nav = $("#nav");
function closeMenu() {
  nav.classList.remove("open");
  menuToggle.setAttribute("aria-expanded", "false");
}
menuToggle.addEventListener("click", () => {
  const open = nav.classList.toggle("open");
  menuToggle.setAttribute("aria-expanded", open);
});
nav.addEventListener("click", (e) => { if (e.target.closest("a")) closeMenu(); });

/* ---------- Mulai ---------- */
buildGrid();
const m = location.hash.match(/v=([\w-]{11})/);
const startIdx = m ? Math.max(0, SITE.videos.findIndex((v) => v.id === m[1])) : 0;
select(startIdx);
if (SITE.autoStartLoading) startLoading();
</script>
